plugins {
    id 'java'
}

group 'net.hey0'
version '130'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'src/main/resources/lib', includes: ['*.jar'])
}

test {
    useJUnitPlatform()
}

compileJava {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
    manifest {
        attributes (
                'Class-Path': 'minecraft_server.jar mysql-connector-java-bin.jar plugins/ ',
                'Main-Class': 'Main'
        )
    }

    from {
        sourceSets.main.collect {
            it.getAllJava().collect {
                println "source: ${it.getPath()}"
                return it
            }
        }
    } exclude '**/*.java'

    processResources.exclude("lib")
    processResources.include("version.txt")
    archiveFileName = 'Minecraft_Mod.jar'
}
